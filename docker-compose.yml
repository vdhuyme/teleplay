services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        API_PORT: ${API_PORT:-8000}
    image: teleplay-api:latest
    container_name: teleplay-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:${API_PORT:-8000}/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: teleplay-bot:latest
    container_name: teleplay-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_URL: "http://api:${API_PORT:-8000}"
    depends_on:
      api:
        condition: service_healthy
