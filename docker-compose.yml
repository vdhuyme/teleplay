services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        PORT: ${PORT:-10000}
    image: teleplay-api:latest
    container_name: teleplay-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${PORT:-10000}:${PORT:-10000}'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--spider',
          'http://localhost:${PORT:-10000}/healthz',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: teleplay-bot:latest
    container_name: teleplay-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
